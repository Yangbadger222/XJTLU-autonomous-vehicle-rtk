ego_vehicle_adapter:
  ros__parameters:
    # These limits are the corridor launch effective values, not EGO demo defaults.
    max_speed_mps: 0.85
    min_speed_mps: 0.0
    max_yaw_rate_rps: 0.70
    max_accel_mps2: 0.85
    max_decel_mps2: 1.20
    max_yaw_accel_rps2: 1.40
    max_yaw_decel_rps2: 1.80
    map_resolution_m: 0.30
    grid_unknown_is_occupied: true
    footprint_source: "LOCKED_URDF_OR_DEPLOYMENT_DUMP_REQUIRED"
    measured_wheel_radius_m: "PENDING"
    measured_track_m: "PENDING"
    allow_reverse: false
    output_topic: /research/ego_trajectory
