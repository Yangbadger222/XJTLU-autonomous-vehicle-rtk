active_observation:
  ros__parameters:
    policy: TASK_AWARE_LOOK
    observation_budget_s: 60.0
    periodic_look_s: 10.0
    settle_s: 1.0
    # NEW_ALGORITHM_SETTING: trust filter, not a measured covariance claim.
    pose_uncertainty_limit_m: 0.10
    # Sensor validity/model and physical curvature are unresolved deployment
    # inputs. Zero blocks all observation motion; simulated fixtures may supply
    # explicitly labelled model values only in isolated domains.
    sensor_range_m: 0.0
    sensor_fov_rad: 0.0
    max_curvature_1pm: 0.0
