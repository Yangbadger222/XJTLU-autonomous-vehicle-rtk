active_observation:
  ros__parameters:
    policy: TASK_AWARE_LOOK
    observation_budget_s: 60.0
    periodic_look_s: 10.0
    settle_s: 1.0
    # NEW_ALGORITHM_SETTING: trust filter, not a measured covariance claim.
    pose_uncertainty_limit_m: 0.10
    # NEW_ALGORITHM_SETTING: finite 3 m query horizon. This never establishes
    # free ground; observed-space/occlusion tests still use the current grid.
    sensor_range_m: 3.0
    # MID360 horizontal FOV from the original mounting notes, generated.
    sensor_fov_rad: 6.283185307179586
    # Conservative algorithm envelope from original corridor w and v*w limits.
    max_curvature_1pm: 0.34602076124567477
