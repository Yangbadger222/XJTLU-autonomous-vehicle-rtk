ego_vehicle_adapter:
  ros__parameters:
    # These limits are the corridor launch effective values, not EGO demo defaults.
    max_speed_mps: 0.85
    min_speed_mps: 0.0
    max_yaw_rate_rps: 0.7
    max_accel_mps2: 0.85
    max_decel_mps2: 1.2
    max_yaw_accel_rps2: 1.4
    max_yaw_decel_rps2: 1.8
    max_lateral_accel_mps2: 0.25
    state_timeout_s: 0.20
    grid_timeout_s: 0.50
    # NEW_ALGORITHM_SETTING: optimizer target only; final physical gates above
    # remain unchanged. Leaves acceleration reserve for measured feedback.
    planning_acceleration_fraction: 0.50
    planning_speed_fraction: 0.80
    # NEW_ALGORITHM_SETTING: conservative optimizer objective; final limits unchanged.
    planning_turn_fraction: 0.80
    planning_turn_penalty_weight: 10.0
    # Replan geometry at 1 Hz; validated trajectory heartbeat stays at 10 Hz.
    replan_period_s: 1.0
    # NEW_ALGORITHM_SETTING generated from original w and v*w limits at Vmax.
    # Numerical lateral tolerance and jerk objective are research settings;
    # these are not measured slip/terrain ability. The original gates remain.
    max_curvature_1pm: 0.34602076124567477
    max_lateral_speed_mps: 0.05
    max_jerk_mps3: 1.7
    inflate_radius_m: 0.4493606569338264
    initial_map_version: "UNKNOWN"
    map_resolution_m: 0.30
    grid_unknown_is_occupied: true
    footprint_source: "LOCKED_CORRIDOR_POLYGON; physical deployment still requires confirmation"
    firmware_command_model_source: "LOCKED_STM32_SOURCE; actual flashed identity requires field verification"
    allow_reverse: false
    output_topic: /research/ego_trajectory
