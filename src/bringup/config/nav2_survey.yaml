# Nav2 Survey 模式参数文件。 (Nav2 Survey mode parameter file.)
# 基于 nav2_explore.yaml，针对室内 Survey 模式在 Jetson Orin NX 上做了保守调优： (Based on nav2_explore.yaml, conservatively tuned for indoor Survey mode on Jetson Orin NX:)
#   - controller_frequency 20→10 Hz（单次循环预算从 50ms 放宽到 100ms） (- controller_frequency 20→10 Hz (Single loop budget relaxed from 50ms to 100ms))
#   - MPPI time_steps 24→12, model_dt 0.05→0.1（总 rollout 评估减半，轨迹时域不变） (- MPPI time_steps 24→12, model_dt 0.05→0.1 (Total rollout evaluation halved, trajectory time domain remains unchanged))
#   - 局部代价地图 30×30m@0.05→6×6m@0.10（栅格数从 360k 降到 3.6k） (- Local costmap 30×30m@0.05→6×6m@0.10 (Grid size reduced from 360k to 3.6k))
#   - velocity_smoother smoothing_frequency 20→10 Hz（与 controller 匹配） (- velocity_smoother smoothing_frequency 20→10 Hz (Matched with controller))
# AMCL 节点参数块；负责静态地图定位和粒子滤波。 (AMCL node parameter block; responsible for static map localization and particle filtering.)
# 改错节点名或层级：AMCL 会读不到参数并回退默认值。 (Incorrect node name or hierarchy: AMCL will fail to read parameters and fallback to defaults.)
amcl:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: true
    # alpha1 表示机器人转动时的转角噪声系数；决定 AMCL 对转角里程计的信任程度。 (alpha1 represents the rotational noise coefficient from robot rotation; determines AMCL's trust in rotational odometry.)
    # 调大：更不相信转角里程计、粒子更分散；调小：更相信转角里程计、收敛更紧。 (Increase: less trust in rotational odometry, particles more scattered; Decrease: more trust, tighter convergence.)
    alpha1: 0.2
    # alpha2 表示直行引起的转角噪声系数；决定平移误差如何映射到朝向误差。 (alpha2 represents the rotational noise coefficient from translation; determines how translation error maps to heading error.)
    # 调大：更容易把直行误差解释成角度漂移；调小：更相信直行时朝向稳定。 (Increase: easier to interpret forward error as angle drift; Decrease: more trust in heading stability during forward motion.)
    alpha2: 0.2
    # alpha3 表示机器人平移时的平移噪声系数；决定 AMCL 对位移里程计的信任程度。 (alpha3 represents the translational noise coefficient from translation; determines AMCL's trust in translational odometry.)
    # 调大：更不相信平移里程计、粒子更分散；调小：更相信平移里程计、定位更紧。 (Increase: less trust in translational odometry, particles more scattered; Decrease: more trust, tighter localization.)
    alpha3: 0.2
    # alpha4 表示转动引起的平移噪声系数；决定转弯误差如何扩散到位置估计。 (alpha4 represents the translational noise coefficient from rotation; determines how turning error diffuses into position estimation.)
    # 调大：转弯时位置更容易发散；调小：转弯时更相信位置估计。 (Increase: position more likely to diverge during turns; Decrease: more trust in position estimation during turns.)
    alpha4: 0.2
    # alpha5 表示额外运动噪声系数；用于补偿模型未覆盖的随机扰动。 (alpha5 represents additional motion noise coefficient; used to compensate for random disturbances not covered by the model.)
    # 调大：鲁棒性更强但粒子更散；调小：估计更集中但更依赖模型正确。 (Increase: stronger robustness but scattered particles; Decrease: concentrated estimation but relies more on model correctness.)
    alpha5: 0.2
    # 机器人基坐标系；AMCL 会把定位结果对齐到该机体坐标。 (Robot base frame; AMCL will align the localization results to this body frame.)
    # 改成错误坐标系：定位姿态会与真实车体不一致。 (Incorrect frame: localization pose will be inconsistent with actual vehicle body.)
    base_frame_id: "base_footprint"
    # beam skip 距离阈值；用于判断哪些激光束可以被视作异常并跳过。 (Beam skip distance threshold; used to determine which laser beams can be considered abnormal and skipped.)
    # 调大：更容易忽略偏离模型的量测；调小：更严格地要求每束参与匹配。 (Increase: easier to ignore measurements deviating from model; Decrease: stricter requirement for every beam to match.)
    beam_skip_distance: 0.5
    # beam skip 误差比例阈值；决定异常束占多大比例才触发跳束。 (Beam skip error ratio threshold; determines what proportion of abnormal beams triggers beam skipping.)
    # 调大：更宽松、不易触发跳束；调小：更敏感、更容易启用跳束。 (Increase: looser, harder to trigger beam skipping; Decrease: more sensitive, easier to enable beam skipping.)
    beam_skip_error_threshold: 0.9
    # beam skip 通过阈值；决定多少束一致时才接受当前扫描。 (Beam skip pass threshold; determines how many consistent beams are required to accept current scan.)
    # 调大：更保守、更强调一致性；调小：更激进、更容易接受当前扫描。 (Increase: more conservative, emphasizes consistency; Decrease: more aggressive, easier to accept current scan.)
    beam_skip_threshold: 0.3
    # 是否启用 beam skip；用于处理局部遮挡或动态障碍导致的异常激光束。 (Whether to enable beam skip; used to handle abnormal laser beams caused by local occlusions or dynamic obstacles.)
    # 改为 true：对异常束更宽容；改为 false：所有束都严格参与匹配。 (If true: more tolerant of abnormal beams; If false: all beams strictly participate in matching.)
    do_beamskip: false
    # AMCL 输出的全局坐标系；通常与地图坐标系一致。 (Global frame output by AMCL; usually consistent with map frame.)
    # 改成其它坐标系：下游导航的 TF 链会对不上。 (Incorrect frame: downstream navigation TF chain will mismatch.)
    global_frame_id: "map"
    # 短量测分布参数；决定激光被近距离遮挡时的概率衰减速度。 (Short measurement distribution parameter; determines probability decay rate when laser is occluded at short range.)
    # 调大：更容易把短量测视作合理遮挡；调小：更容易把短量测视作异常。 (Increase: easier to consider short measurements as reasonable occlusion; Decrease: easier to consider them as abnormal.)
    lambda_short: 0.1
    # 似然场最大匹配距离；决定离地图障碍多远仍能贡献激光匹配分。 (Likelihood field max matching distance; determines how far from map obstacles a laser measurement can still contribute to matching score.)
    # 调大：远离障碍的量测也能参与评分；调小：只有更贴近障碍的量测才有高分。 (Increase: measurements far from obstacles can also contribute; Decrease: only measurements closer to obstacles score high.)
    laser_likelihood_max_dist: 2.0
    # 定位时接受的最大激光距离；超过该值的量测不会参与 AMCL。 (Max laser range accepted for localization; measurements beyond this value will not participate in AMCL.)
    # 调大：可利用更远量测但噪声也更多；调小：更保守但远距信息更少。 (Increase: can utilize further measurements but more noise; Decrease: more conservative but less long-range information.)
    laser_max_range: 100.0
    # 定位时接受的最小激光距离；用于过滤本体附近或近场噪声。 (Min laser range accepted for localization; used to filter near-body or near-field noise.)
    # 调大：更能滤掉近场噪声；调小：会保留更多近距离量测。 (Increase: filters near-field noise better; Decrease: retains more short-range measurements.)
    laser_min_range: -1.0
    # 激光观测模型类型；决定 AMCL 如何计算扫描与地图的匹配分。 (Laser observation model type; determines how AMCL calculates matching score between scan and map.)
    # 改成其它模型：定位收敛特性和容错性都会变化。 (Incorrect model: localization convergence characteristics and fault tolerance will change.)
    laser_model_type: "likelihood_field"
    # 单次参与 AMCL 匹配的最大激光束数量；用于平衡定位信息量和算力开销。 (Max number of laser beams participating in single AMCL matching; used to balance localization information and computational overhead.)
    # 调大：匹配更细致但 CPU 更高；调小：计算更省但匹配信息更少。 (Increase: more detailed matching but higher CPU; Decrease: computationally cheaper but less matching information.)
    max_beams: 60
    # 最大粒子数；决定 AMCL 最多可以保留多少候选位姿。 (Max particles; determines how many candidate poses AMCL can keep at most.)
    # 调大：定位更稳但算力和内存更高；调小：更省资源但复杂场景更易丢定位。 (Increase: more stable localization but higher CPU/Memory; Decrease: saves resources but easier to lose localization in complex scenes.)
    max_particles: 2000
    # 最小粒子数；决定 AMCL 至少保留多少候选位姿。 (Min particles; determines how many candidate poses AMCL must keep at least.)
    # 调大：低不确定性时也保持更稳但更耗资源；调小：更省资源但抗突发误差更弱。 (Increase: remains stable at low uncertainty but consumes resources; Decrease: saves resources but weaker against sudden errors.)
    min_particles: 500
    # 里程计坐标系；AMCL 会基于该坐标系接收运动信息。 (Odometry frame; AMCL will receive motion information based on this frame.)
    # 改成错误坐标系：定位更新会与里程计链路错位。 (Incorrect frame: localization updates will mismatch with odometry link.)
    odom_frame_id: "odom"
    # 自适应粒子滤波误差上界；用于估算需要多少粒子才能满足当前精度。 (Adaptive particle filter error bound; used to estimate how many particles are needed for current accuracy.)
    # 调大：更容易减少粒子数、算力更省；调小：更严格地要求粒子数量。 (Increase: easier to reduce particle count, saves CPU; Decrease: stricter requirement for particle count.)
    pf_err: 0.05
    # 自适应粒子滤波置信度；决定希望以多高置信度覆盖真实位姿。 (Adaptive particle filter confidence; determines desired confidence level to cover true pose.)
    # 调大：更追求高置信度、粒子数倾向增多；调小：更容易接受较少粒子。 (Increase: pursues higher confidence, tends to increase particles; Decrease: easier to accept fewer particles.)
    pf_z: 0.99
    # 快速恢复系数；控制异常时向粒子群快速注入随机粒子的速度。 (Fast recovery coefficient; controls speed of injecting random particles during anomalies.)
    # 调大：恢复更积极但更容易抖动；调小：恢复更慢但状态更稳。 (Increase: more active recovery but prone to jitter; Decrease: slower recovery but more stable state.)
    recovery_alpha_fast: 0.0
    # 慢速恢复系数；控制长期失配时随机粒子的注入速度。 (Slow recovery coefficient; controls speed of injecting random particles during long-term mismatches.)
    # 调大：长期偏移时更快扩散搜索；调小：更保守但恢复更慢。 (Increase: faster diffusion search during long-term drift; Decrease: more conservative but slower recovery.)
    recovery_alpha_slow: 0.0
    # 重采样间隔；决定 AMCL 每做多少次更新后执行一次粒子重采样。 (Resampling interval; determines how many updates before AMCL performs particle resampling.)
    # 调大：重采样更少、效率更高；调小：重采样更频繁、收敛更快但更耗算力。 (Increase: less resampling, higher efficiency; Decrease: more frequent resampling, faster convergence but more CPU.)
    resample_interval: 1
    # 运动模型类型；决定 AMCL 如何把里程计运动映射到粒子。 (Motion model type; determines how AMCL maps odometry motion to particles.)
    # 改成不匹配的模型：定位响应和误差传播会失真。 (Incorrect model: localization response and error propagation will be distorted.)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # 定位结果保存频率；决定 AMCL 多久把当前位姿写回参数。 (Localization result save frequency; determines how often AMCL writes current pose back to parameters.)
    # 调大：保存更频繁、恢复更及时；调小：写入更少但重启后恢复更慢。 (Increase: more frequent saving, quicker recovery; Decrease: less writing but slower recovery after restart.)
    save_pose_rate: 0.5
    # 命中模型标准差；决定激光命中障碍时的误差容忍范围。 (Hit model standard deviation; determines error tolerance when laser hits obstacles.)
    # 调大：对偏差更宽容；调小：更强调精确命中。 (Increase: more tolerant of deviation; Decrease: emphasizes precise hits.)
    sigma_hit: 0.2
    # 是否广播 map 到 odom 的 TF；决定 AMCL 是否直接输出定位变换。 (Whether to broadcast map to odom TF; determines if AMCL outputs localization transform directly.)
    # 改为 true：由 AMCL 提供 TF；改为 false：需要外部链路自行维护该 TF。 (If true: AMCL provides TF; If false: external link must maintain this TF.)
    tf_broadcast: true
    # TF 容忍时间；决定该模块接受多大的 TF 时间偏差。 (TF tolerance time; determines how much TF time deviation this module accepts.)
    # 调大：对 TF 延迟更宽松；调小：更严格但更容易因延迟失败。 (Increase: looser on TF latency; Decrease: stricter but easier to fail due to latency.)
    transform_tolerance: 1.0
    # 最小更新或进展阈值；低于它时系统通常认为变化不够明显。 (Min update or progress threshold; below this, system typically considers change insignificant.)
    # 调大：更不敏感；调小：更敏感。 (Increase: less sensitive; Decrease: more sensitive.)
    update_min_a: 0.2
    # 最小更新或进展阈值；低于它时系统通常认为变化不够明显。 (Min update or progress threshold; below this, system typically considers change insignificant.)
    # 调大：更不敏感；调小：更敏感。 (Increase: less sensitive; Decrease: more sensitive.)
    update_min_d: 0.25
    # 命中项权重；决定与地图精确对齐的量测在总评分中的影响。 (Hit weight; determines influence of precisely aligned measurements in total score.)
    # 调大：更强调精确命中；调小：命中项影响减弱。 (Increase: emphasizes precise hits; Decrease: reduces hit influence.)
    z_hit: 0.5
    # 超量程项权重；决定远距或无返回量测在评分中的影响。 (Max weight; determines influence of far or no-return measurements in score.)
    # 调大：更重视超量程量测；调小：更弱化这类量测。 (Increase: more emphasis on max range measurements; Decrease: weakens these measurements.)
    z_max: 0.05
    # 随机量测项权重；决定异常量测在评分中的影响。 (Random weight; determines influence of abnormal measurements in score.)
    # 调大：对异常量测更宽容；调小：更依赖模型解释量测。 (Increase: more tolerant of abnormal measurements; Decrease: relies more on model explanation.)
    z_rand: 0.5
    # 短量测项权重；决定近距离遮挡量测在评分中的影响。 (Short weight; determines influence of short range occluded measurements in score.)
    # 调大：更容易把短量测视作合理；调小：更容易把它视作异常。 (Increase: easier to consider short measurements reasonable; Decrease: easier to consider them abnormal.)
    z_short: 0.05
    # 输入或输出话题名；决定该模块从哪里取数据或向哪里发数据。 (Input or output topic name; determines where the module gets or sends data.)
    # 改错话题：上下游节点会直接断链。 (Incorrect topic: upstream/downstream nodes will directly disconnect.)
    scan_topic: scan
# BT Navigator 节点参数块；负责组织规划、控制和恢复动作。 (BT Navigator node parameter block; responsible for organizing planning, control, and recovery actions.)
# 改错节点名或层级：导航行为树会读不到参数或启动失败。 (Incorrect node name or hierarchy: navigation behavior tree will fail to read parameters or fail to start.)
bt_navigator:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 全局参考坐标系；决定规划、行为或代价地图在 TF 树中的根坐标。 (Global reference frame; determines root frame for planning, behaviors, or costmap in TF tree.)
    # 改成错误坐标系：地图、路径和机器人位姿会整体错位。 (Incorrect frame: map, path, and robot pose will be entirely misaligned.)
    global_frame: map
    # 机器人基坐标系；决定导航模块认为“机器人本体”对应哪个 TF。 (Robot base frame; determines which TF the navigation module considers as the 'robot body'.)
    # 改成错误坐标系：碰撞检查、控制和行为判断都会失真。 (Incorrect frame: collision checking, control, and behavior judgments will be distorted.)
    robot_base_frame: base_link
    # 输入或输出话题名；决定该模块从哪里取数据或向哪里发数据。 (Input or output topic name; determines where the module gets or sends data.)
    # 改错话题：上下游节点会直接断链。 (Incorrect topic: upstream/downstream nodes will directly disconnect.)
    odom_topic: /fastlio2/lio_odom
    # 行为树循环周期毫秒数；决定导航行为树 tick 的频率。 (Behavior tree loop duration in ms; determines tick frequency of navigation behavior tree.)
    # 调大：行为树响应更慢但更省 CPU；调小：响应更快但线程负载更高。 (Increase: slower BT response but saves CPU; Decrease: faster response but higher thread load.)
    bt_loop_duration: 10
    # 动作和服务默认超时；用于判定下游节点是否失联。 (Default timeout for actions and services; used to determine if downstream node is lost.)
    # 调大：对慢节点更宽容；调小：更快暴露超时但更容易误判。 (Increase: more tolerant of slow nodes; Decrease: exposes timeouts faster but easier to misjudge.)
    default_server_timeout: 20
    # 等待服务就绪的超时；决定启动阶段等待下游组件多久。 (Wait for service timeout; determines how long to wait for downstream components during startup.)
    # 调大：更能容忍慢启动；调小：启动失败会更快暴露。 (Increase: more tolerant of slow startup; Decrease: startup failures exposed faster.)
    wait_for_service_timeout: 1000
    # 默认 NavigateToPose 行为树 XML；由 launch 在运行时注入 corridor 专用 BT。 (Default NavigateToPose behavior tree XML; corridor-specific BT is injected at runtime by launch.)
    # 不注入时回退默认空字符串，由 Nav2 使用上游默认树。 (When not injected, falls back to empty string, and Nav2 uses upstream default tree.)
    default_nav_to_pose_bt_xml: ""
    # 默认 NavigateThroughPoses 行为树 XML；由 launch 在运行时注入 corridor 专用 BT。 (Default NavigateThroughPoses behavior tree XML; corridor-specific BT is injected at runtime by launch.)
    # 不注入时回退默认空字符串，由 Nav2 使用上游默认树。 (When not injected, falls back to empty string, and Nav2 uses upstream default tree.)
    default_nav_through_poses_bt_xml: ""
    # 行为树插件库列表；决定导航行为树能加载哪些 BT 节点。 (Behavior tree plugin library list; determines which BT nodes the navigation behavior tree can load.)
    # 增删插件库：会改变可用行为或导致某些节点加载失败。 (Adding/removing plugins: will change available behaviors or cause some nodes to fail loading.)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
# Navigate Through Poses 辅助节点参数块；负责该动作接口的基础 ROS 参数。 (Navigate Through Poses helper node parameter block; responsible for basic ROS parameters of this action interface.)
# 改错节点名或层级：对应动作接口会读不到参数。 (Incorrect node name or hierarchy: corresponding action interface will fail to read parameters.)
bt_navigator_navigate_through_poses_rclcpp_node:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
# Navigate To Pose 辅助节点参数块；负责该动作接口的基础 ROS 参数。 (Navigate To Pose helper node parameter block; responsible for basic ROS parameters of this action interface.)
# 改错节点名或层级：对应动作接口会读不到参数。 (Incorrect node name or hierarchy: corresponding action interface will fail to read parameters.)
bt_navigator_navigate_to_pose_rclcpp_node:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
# Controller Server 节点参数块；负责局部轨迹跟踪与速度控制。 (Controller Server node parameter block; responsible for local trajectory tracking and speed control.)
# 改错节点名或层级：局部控制器会回退默认值或启动失败。 (Incorrect node name or hierarchy: local controller will fallback to defaults or fail to start.)
controller_server:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # TF 容忍时间；决定该模块接受多大的 TF 时间偏差。 (TF tolerance time; determines how much TF time deviation this module accepts.)
    # 调大：对 TF 延迟更宽松；调小：更严格但更容易因延迟失败。 (Increase: looser on TF latency; Decrease: stricter but easier to fail due to latency.)
    transform_tolerance: 0.5
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 控制循环频率；决定局部控制器每秒更新多少次速度指令。 (Control loop frequency; determines how many times per second the local controller updates speed commands.)
    # Survey 模式降至 10 Hz，给 MPPI 更多单次计算预算（100ms）。 (Survey mode reduced to 10 Hz, giving MPPI more single computation budget (100ms).)
    controller_frequency: 10.0
    # 前向速度死区阈值；低于该值的前向速度会被视为零。 (Forward velocity deadband threshold; forward velocities below this value will be considered zero.)
    # 调大：更能压制微抖动；调小：更容易保留细小前进速度。 (Increase: better suppresses micro-jitter; Decrease: easier to retain small forward speeds.)
    min_x_velocity_threshold: 0.001
    # 侧向速度死区阈值；低于该值的横向速度会被视为零。 (Lateral velocity deadband threshold; lateral velocities below this value will be considered zero.)
    # 调大：更能压制横向噪声；调小：更容易保留微小侧移。 (Increase: better suppresses lateral noise; Decrease: easier to retain small lateral movements.)
    min_y_velocity_threshold: 0.5
    # 角速度死区阈值；低于该值的角速度会被视为零。 (Angular velocity deadband threshold; angular velocities below this value will be considered zero.)
    # 调大：更能抑制原地抖头；调小：更容易保留细小转向。 (Increase: better suppresses on-the-spot jitter; Decrease: easier to retain small turns.)
    min_theta_velocity_threshold: 0.001
    # 控制失败容忍度；决定局部控制短时失败时还能容忍多大误差。 (Control failure tolerance; determines how much error can be tolerated during brief local control failures.)
    # 调大：系统更宽容、不易立刻失败；调小：更严格、更快进入恢复。 (Increase: system more tolerant, less likely to fail immediately; Decrease: stricter, enters recovery faster.)
    failure_tolerance: 0.6
    # 进度检查器名称；用于选择 controller server 里启用哪一个卡住判定器。 (Progress checker name; used to select which stuck detector to enable in controller server.)
    # 改错名称：控制器会找不到对应检查器并启动失败。 (Incorrect name: controller will not find corresponding checker and fail to start.)
    progress_checker_plugin: "progress_checker"
    # 目标检查器列表；决定局部控制器可选择哪些到点判定器。 (Goal checker list; determines which arrival detectors the local controller can choose.)
    # 增删检查器：会改变到点判定能力或导致引用失败。 (Adding/removing checkers: will change arrival detection ability or cause reference failure.)
    goal_checker_plugins: ["general_goal_checker"]
    # 控制器插件列表；决定当前局部控制使用哪些控制器实现。 (Controller plugin list; determines which controller implementations current local control uses.)
    # 增删控制器：会改变局部跟踪能力或导致启动失败。 (Adding/removing controllers: will change local tracking ability or cause failure to start.)
    controller_plugins: ["FollowPath"]
    # 进度检查器参数块；负责判断机器人是否长时间原地不动。 (Progress checker parameter block; responsible for judging if robot is stationary for too long.)
    # 改成其它结构或缺少子参数：卡住检测会异常。 (Incorrect structure or missing sub-parameters: stuck detection will be abnormal.)
    progress_checker:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_controller::SimpleProgressChecker"
      # 最小有效移动半径；在该时间窗内位移小于此值会被视为没前进。 (Min required movement radius; displacement less than this within the time window is considered no progress.)
      # 调大：更容易判定卡住；调小：更不容易触发卡住。 (Increase: easier to judge as stuck; Decrease: less likely to trigger stuck.)
      required_movement_radius: 0.15
      # 移动超时时间；决定多久没有明显进展就判定为卡住。 (Movement time allowance; determines how long without significant progress triggers stuck judgment.)
      # 调大：更宽容、更晚判定卡住；调小：更严格、更早进入恢复。 (Increase: more tolerant, later stuck judgment; Decrease: stricter, earlier recovery entry.)
      movement_time_allowance: 10.0
    # 目标检查器参数块；负责位置和朝向的到点判定。 (Goal checker parameter block; responsible for position and orientation arrival judgment.)
    # 改成其它结构或缺少子参数：到点判断会失真。 (Incorrect structure or missing sub-parameters: arrival judgment will be distorted.)
    general_goal_checker:
      # 状态保持开关；决定模块是否保留上一时刻内部状态。 (Stateful switch; determines if module retains internal state from previous moment.)
      # 改为 true：连续性更好；改为 false：每次都独立处理。 (If true: better continuity; If false: processed independently each time.)
      stateful: true
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_controller::SimpleGoalChecker"
      # 平面位置到点容差；进入该半径内可视为位置达到目标。 (XY goal tolerance; entering this radius is considered reaching target position.)
      # 调大：更容易判定到点；调小：更严格、更接近目标才算到点。 (Increase: easier to judge arrival; Decrease: stricter, requires closer proximity to target.)
      xy_goal_tolerance: 0.35
      # 朝向到点容差；角度误差小于该值可视为方向对正。 (Yaw goal tolerance; angular error less than this is considered correctly oriented.)
      # 调大：更容易判定朝向达标；调小：更严格、更要求精确对正。 (Increase: easier to judge orientation reached; Decrease: stricter, requires precise alignment.)
      yaw_goal_tolerance: 6.28
    # MPPI 控制器参数块；负责采样候选轨迹并结合 costmap 代价做局部避障。 (MPPI controller parameter block; responsible for sampling candidate trajectories and combining costmap costs for local obstacle avoidance.)
    # 改成其它结构或缺少子参数：局部跟踪行为会明显变化。 (Incorrect structure or missing sub-parameters: local tracking behavior will change significantly.)
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.65
      angular_disengage_threshold: 0.35
      forward_sampling_distance: 0.65
      rotate_to_heading_angular_vel: 0.24
      max_angular_accel: 0.65
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      closed_loop: false
      time_steps: 16
      model_dt: 0.1
      batch_size: 128
      vx_std: 0.16
      vy_std: 0.0
      wz_std: 0.10
      vx_max: 0.30
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.65
      wz_min: -0.65
      ax_max: 0.40
      ax_min: -0.8
      az_max: 2.0
      az_min: -2.0
      iteration_count: 1
      prune_distance: 4.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      publish_critics_stats: false
      visualize: false
      reset_period: 1.0
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "VelocityDeadbandCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.5
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        deadband_velocities: [0.12, 0.0, 0.08]

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 5
        threshold_to_consider: 0.5
        offset_from_furthest: 6
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
# 局部代价地图参数块；负责近场避障和局部环境表达。 (Local costmap parameter block; responsible for near-field obstacle avoidance and local environment representation.)
# 改错节点名或层级：局部代价地图会读不到参数。 (Incorrect node name or hierarchy: local costmap will fail to read parameters.)
local_costmap:
  # 代价地图命名空间参数块；用于承载该 costmap 的具体 ROS 参数。 (Costmap namespace parameter block; used to carry specific ROS parameters for this costmap.)
  # 改错这一层级：costmap 可能不会读取到下方配置。 (Incorrect hierarchy: costmap may not read configurations below.)
  local_costmap:
    # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
    # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
    ros__parameters:
      # 代价地图更新频率；决定障碍信息每秒刷新多少次。 (Costmap update frequency; determines how many times per second obstacle information is refreshed.)
      # Survey 模式降至 6 Hz，减轻 CPU 与 controller 竞争。 (Survey mode reduced to 6 Hz to alleviate CPU competition with controller.)
      update_frequency: 6.0
      # 代价地图发布频率；决定对外发布地图消息的频率。 (Costmap publish frequency; determines frequency of publishing map messages externally.)
      # 调大：下游拿到新地图更快；调小：带宽和 CPU 开销更低。 (Increase: downstream gets new maps faster; Decrease: lower bandwidth and CPU overhead.)
      publish_frequency: 3.0
      # 全局参考坐标系；决定规划、行为或代价地图在 TF 树中的根坐标。 (Global reference frame; determines root frame for planning, behaviors, or costmap in TF tree.)
      # 改成错误坐标系：地图、路径和机器人位姿会整体错位。 (Incorrect frame: map, path, and robot pose will be entirely misaligned.)
      global_frame: odom
      # 机器人基坐标系；决定导航模块认为“机器人本体”对应哪个 TF。 (Robot base frame; determines which TF the navigation module considers as the 'robot body'.)
      # 改成错误坐标系：碰撞检查、控制和行为判断都会失真。 (Incorrect frame: collision checking, control, and behavior judgments will be distorted.)
      robot_base_frame: base_link
      # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
      # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
      use_sim_time: false
      # 滚动窗口开关；决定代价地图是固定在世界坐标还是跟着机器人移动。 (Rolling window switch; determines if costmap is fixed in world coordinates or moves with robot.)
      # 改为 true：地图跟车移动；改为 false：地图固定在全局坐标。 (If true: map moves with vehicle; If false: map is fixed in global coordinates.)
      rolling_window: true
      # 地图宽度；决定 costmap 在 X 方向覆盖的物理范围。 (Map width; determines physical range costmap covers in X direction.)
      # Survey 模式室内场景 6m 已足够局部避障。 (Survey mode indoor scene 6m is sufficient for local obstacle avoidance.)
      width: 6
      # 地图高度；决定 costmap 在 Y 方向覆盖的物理范围。 (Map height; determines physical range costmap covers in Y direction.)
      # Survey 模式室内场景 6m 已足够局部避障。 (Survey mode indoor scene 6m is sufficient for local obstacle avoidance.)
      height: 6
      # 地图分辨率；决定每个栅格代表的物理尺寸。 (Map resolution; determines physical size each grid cell represents.)
      # Survey 模式从 0.05 放宽到 0.10，栅格数降 4 倍。
      resolution: 0.10
      # 机器人安全半径；用于碰撞检查和膨胀边界计算。 (Robot radius; used for collision checking and inflation boundary calculation.)
      # 调大：更保守、更不易贴边；调小：更激进、更容易走窄路。 (Increase: more conservative, less likely to stick to edges; Decrease: more aggressive, easier to navigate narrow paths.)
      # robot_radius: 0.38625
      footprint: "[[0.35, 0.275], [0.35, -0.275], [-0.35, -0.275], [-0.35, 0.275]]"
      # 代价地图层列表；决定当前 costmap 会叠加哪些地图层。 (Costmap layer list; determines which map layers current costmap will overlay.)
      # 增删地图层：会直接改变障碍信息来源和代价图行为。 (Adding/removing map layers: directly changes obstacle info source and costmap behavior.)
      plugins: ["stvl_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 4
        group_connectivity_type: 8
      # 膨胀层参数块；负责给障碍物外围增加安全缓冲。 (Inflation layer parameter block; responsible for adding safety buffer around obstacles.)
      # 改错结构或参数：障碍安全边界会偏大或偏小。 (Incorrect structure or parameters: obstacle safety boundary will be too large or too small.)
      inflation_layer:
        # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
        # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
        plugin: "nav2_costmap_2d::InflationLayer"
        # 代价场参数；决定障碍物周围代价衰减和安全边界形状。 (Cost scaling factor; determines cost decay around obstacles and safety boundary shape.)
        # 调大：代价场变化更明显或更保守；调小：更激进或更平缓。 (Increase: cost field changes more obviously or conservatively; Decrease: more aggressive or gentler.)
        cost_scaling_factor: 3.0 # 2.5 badger
        # 代价场参数；决定障碍物周围代价衰减和安全边界形状。 (Cost scaling factor; determines cost decay around obstacles and safety boundary shape.)
        # 调大：代价场变化更明显或更保守；调小：更激进或更平缓。 (Increase: cost field changes more obviously or conservatively; Decrease: more aggressive or gentler.)
        inflation_radius: 0.40
      # STVL 参数块；负责把 3D 点云写入体素层，并通过时间衰减清除陈旧障碍。 (STVL parameter block; responsible for writing 3D point cloud into voxel layer and clearing stale obstacles via time decay.)
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.8
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: -0.45
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud_mark pointcloud_clear
        pointcloud_mark:
          data_type: "PointCloud2"
          topic: /fastlio2/body_cloud
          marking: true
          clearing: false
          obstacle_range: 15.0
          min_obstacle_height: -0.33
          max_obstacle_height: 0.30
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: false
        pointcloud_clear:
          enabled: true
          data_type: "PointCloud2"
          topic: /fastlio2/body_cloud
          marking: false
          clearing: true
          max_z: 0.30
          min_z: -0.33
          vertical_fov_angle: 1.03
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          model_type: 1
      # 是否总是发送完整代价地图；决定 costmap 发布全量还是增量更新。 (Always send full costmap; determines if costmap publishes full or incremental updates.)
      # 改为 true：下游更稳但带宽更高；改为 false：更省带宽但对订阅端要求更高。 (If true: downstream more stable but higher bandwidth; If false: saves bandwidth but higher requirement for subscriber.)
      always_send_full_costmap: false
# 全局代价地图参数块；负责全局规划使用的障碍表达。 (Global costmap parameter block; responsible for obstacle representation used in global planning.)
# 改错节点名或层级：全局代价地图会读不到参数。 (Incorrect node name or hierarchy: global costmap will fail to read parameters.)
global_costmap:
  # 代价地图命名空间参数块；用于承载该 costmap 的具体 ROS 参数。 (Costmap namespace parameter block; used to carry specific ROS parameters for this costmap.)
  # 改错这一层级：costmap 可能不会读取到下方配置。 (Incorrect hierarchy: costmap may not read configurations below.)
  global_costmap:
    # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
    # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
    ros__parameters:
      # 代价地图更新频率；决定障碍信息每秒刷新多少次。 (Costmap update frequency; determines how many times per second obstacle information is refreshed.)
      # 调大：环境更新更及时但 CPU 更高；调小：更省资源但环境变化反映更慢。 (Increase: environment updates timelier but higher CPU; Decrease: saves resources but slower reflection of environment changes.)
      update_frequency: 5.0
      # 代价地图发布频率；决定对外发布地图消息的频率。 (Costmap publish frequency; determines frequency of publishing map messages externally.)
      # 调大：下游拿到新地图更快；调小：带宽和 CPU 开销更低。 (Increase: downstream gets new maps faster; Decrease: lower bandwidth and CPU overhead.)
      publish_frequency: 2.0
      # 全局参考坐标系；决定规划、行为或代价地图在 TF 树中的根坐标。 (Global reference frame; determines root frame for planning, behaviors, or costmap in TF tree.)
      # 改成错误坐标系：地图、路径和机器人位姿会整体错位。 (Incorrect frame: map, path, and robot pose will be entirely misaligned.)
      global_frame: map
      # 机器人基坐标系；决定导航模块认为“机器人本体”对应哪个 TF。 (Robot base frame; determines which TF the navigation module considers as the 'robot body'.)
      # 改成错误坐标系：碰撞检查、控制和行为判断都会失真。 (Incorrect frame: collision checking, control, and behavior judgments will be distorted.)
      robot_base_frame: base_link
      # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
      # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
      use_sim_time: false
      # 机器人安全半径；用于碰撞检查和膨胀边界计算。 (Robot radius; used for collision checking and inflation boundary calculation.)
      # 调大：更保守、更不易贴边；调小：更激进、更容易走窄路。 (Increase: more conservative, less likely to stick to edges; Decrease: more aggressive, easier to navigate narrow paths.)
      # robot_radius: 0.38625
      footprint: "[[0.35, 0.275], [0.35, -0.275], [-0.35, -0.275], [-0.35, 0.275]]"
      # 地图分辨率；决定每个栅格代表的物理尺寸。 (Map resolution; determines physical size each grid cell represents.)
      # 调大：地图更粗、更省内存；调小：地图更细、更精确但更耗资源。 (Increase: coarser map, saves memory; Decrease: finer map, more precise but consumes more resources.)
      resolution: 0.10
      # 是否追踪未知区域；决定全局规划是否把未知空间单独表达出来。 (Track unknown space; determines if global planning expresses unknown space separately.)
      # 改为 true：未知区域更明确；改为 false：未知区域更容易被当作可通行。 (If true: unknown area more explicit; If false: unknown area easier to be treated as passable.)
      track_unknown_space: true
      # 滚动窗口开关；决定代价地图是固定在世界坐标还是跟着机器人移动。 (Rolling window switch; determines if costmap is fixed in world coordinates or moves with robot.)
      # 改为 true：地图跟车移动；改为 false：地图固定在全局坐标。 (If true: map moves with vehicle; If false: map is fixed in global coordinates.)
      rolling_window: true
      # 地图宽度；决定 costmap 在 X 方向覆盖的物理范围。 (Map width; determines physical range costmap covers in X direction.)
      # 调大：覆盖更广但内存和更新开销更高；调小：更省资源但看不到更远区域。 (Increase: wider coverage but higher memory/update overhead; Decrease: saves resources but cannot see further areas.)
      width: 100
      # 地图高度；决定 costmap 在 Y 方向覆盖的物理范围。 (Map height; determines physical range costmap covers in Y direction.)
      # 调大：覆盖更广但内存和更新开销更高；调小：更省资源但看不到更远区域。 (Increase: wider coverage but higher memory/update overhead; Decrease: saves resources but cannot see further areas.)
      height: 100
      # 代价地图层列表；决定当前 costmap 会叠加哪些地图层。 (Costmap layer list; determines which map layers current costmap will overlay.)
      # 增删地图层：会直接改变障碍信息来源和代价图行为。 (Adding/removing map layers: directly changes obstacle info source and costmap behavior.)
      plugins: ["stvl_layer", "inflation_layer"]
      # 膨胀层参数块；负责给障碍物外围增加安全缓冲。 (Inflation layer parameter block; responsible for adding safety buffer around obstacles.)
      # 改错结构或参数：障碍安全边界会偏大或偏小。 (Incorrect structure or parameters: obstacle safety boundary will be too large or too small.)
      inflation_layer:
        # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
        # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
        plugin: "nav2_costmap_2d::InflationLayer"
        # 代价场参数；决定障碍物周围代价衰减和安全边界形状。 (Cost scaling factor; determines cost decay around obstacles and safety boundary shape.)
        # 调大：代价场变化更明显或更保守；调小：更激进或更平缓。 (Increase: cost field changes more obviously or conservatively; Decrease: more aggressive or gentler.)
        cost_scaling_factor: 3.0 # 2.5 badger
        # 代价场参数；决定障碍物周围代价衰减和安全边界形状。 (Cost scaling factor; determines cost decay around obstacles and safety boundary shape.)
        # 调大：代价场变化更明显或更保守；调小：更激进或更平缓。 (Increase: cost field changes more obviously or conservatively; Decrease: more aggressive or gentler.)
        inflation_radius: 0.30
      # STVL 参数块；负责让全局图中的近场动态障碍自动衰减，避免人走开后仍残留。 (STVL parameter block; responsible for auto-decaying near-field dynamic obstacles in global map, avoiding remnants after people walk away.)
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: -0.45
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud_mark pointcloud_clear
        pointcloud_mark:
          data_type: "PointCloud2"
          topic: /fastlio2/body_cloud
          marking: true
          clearing: false
          obstacle_range: 15.0
          min_obstacle_height: -0.33
          max_obstacle_height: 0.30
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: false
        pointcloud_clear:
          enabled: true
          data_type: "PointCloud2"
          topic: /fastlio2/body_cloud
          marking: false
          clearing: true
          max_z: 0.30
          min_z: -0.33
          vertical_fov_angle: 1.03
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
          model_type: 1
      # 是否总是发送完整代价地图；决定 costmap 发布全量还是增量更新。 (Always send full costmap; determines if costmap publishes full or incremental updates.)
      # 改为 true：下游更稳但带宽更高；改为 false：更省带宽但对订阅端要求更高。 (If true: downstream more stable but higher bandwidth; If false: saves bandwidth but higher requirement for subscriber.)
      always_send_full_costmap: true
# Map Server 节点参数块；负责加载静态地图。 (Map Server node parameter block; responsible for loading static maps.)
# 改错节点名或层级：地图服务器会读不到参数或地图加载失败。 (Incorrect node name or hierarchy: map server will fail to read parameters or map loading will fail.)
map_server:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 地图文件路径；决定运行时加载哪张静态地图。 (Map file path; determines which static map to load at runtime.)
    # 改成错误路径：地图加载失败；改成其它地图：整个导航环境都会变化。 (Incorrect path: map load fails; Change to another map: entire navigation environment changes.)
    yaml_filename: ""
# Map Saver 节点参数块；负责导出地图。 (Map Saver node parameter block; responsible for exporting maps.)
# 改错节点名或层级：地图保存服务会读不到参数。 (Incorrect node name or hierarchy: map saving service will fail to read parameters.)
map_saver:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 地图保存超时；决定导出地图时等待磁盘写入多久。 (Map save timeout; determines how long to wait for disk write when exporting map.)
    # 调大：更能容忍慢写盘；调小：失败暴露更快。 (Increase: more tolerant of slow disk write; Decrease: failure exposed faster.)
    save_map_timeout: 5.0
    # 默认空闲阈值；决定导出地图时多大概率以下会写成空闲格。 (Default free threshold; determines below what probability it will be written as a free grid.)
    # 调大：更容易把区域判为空闲；调小：更保守。 (Increase: easier to judge area as free; Decrease: more conservative.)
    free_thresh_default: 0.25
    # 默认占用阈值；决定导出地图时多大概率以上会写成障碍格。 (Default occupied threshold; determines above what probability it will be written as an occupied grid.)
    # 调大：更难判成障碍；调小：更容易判成障碍。 (Increase: harder to judge as obstacle; Decrease: easier to judge as obstacle.)
    occupied_thresh_default: 0.65
    # 是否使用 transient local 订阅地图；决定晚加入节点能否拿到已发布地图。 (Map subscribe transient local; determines if late-joining nodes can receive already published maps.)
    # 改为 true：更能接收到历史地图；改为 false：更依赖地图重新发布。 (If true: better able to receive historical maps; If false: relies more on map republishing.)
    map_subscribe_transient_local: true
# Planner Server 节点参数块；负责生成全局路径。 (Planner Server node parameter block; responsible for generating global paths.)
# 改错节点名或层级：全局规划器会回退默认值或启动失败。 (Incorrect node name or hierarchy: global planner will fallback to defaults or fail to start.)
planner_server:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # TF 容忍时间；决定该模块接受多大的 TF 时间偏差。 (TF tolerance time; determines how much TF time deviation this module accepts.)
    # 调大：对 TF 延迟更宽松；调小：更严格但更容易因延迟失败。 (Increase: looser on TF latency; Decrease: stricter but easier to fail due to latency.)
    transform_tolerance: 0.8
    # 期望规划频率；用于监控全局规划线程是否跟上预期节奏。 (Expected planner frequency; used to monitor if global planning thread keeps up with expected pace.)
    # 调大：更强调高频规划；调小：监控更宽松。 (Increase: emphasizes high-frequency planning; Decrease: looser monitoring.)
    expected_planner_frequency: 5.0
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 全局规划器列表；决定 planner server 可调用哪些规划器。 (Global planner list; determines which planners the planner server can call.)
    # 增删规划器：会改变路径生成能力或导致引用失败。 (Adding/removing planners: will change path generation ability or cause reference failure.)
    planner_plugins: ["GridBased"]
    # 全局规划器参数块；负责配置 NavFn 的搜索行为。 (Global planner parameter block; responsible for configuring NavFn's search behavior.)
    # 改错结构或参数：全局路径质量和可达性会变化。 (Incorrect structure or parameters: global path quality and reachability will change.)
    GridBased:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 容差参数；决定当前算法接受多大误差仍视为有效。 (Tolerance parameter; determines how much error current algorithm accepts while remaining valid.)
      # 调大：更宽松；调小：更严格。 (Increase: looser; Decrease: stricter.)
      tolerance: 0.5
      # 是否使用 A* 搜索；决定 NavFn 走 A* 还是更传统的搜索策略。 (Whether to use A* search; determines if NavFn uses A* or more traditional search strategy.)
      # 改为 true：通常更偏向启发式搜索；改为 false：更接近传统全图搜索。 (If true: generally leans towards heuristic search; If false: closer to traditional full-graph search.)
      use_astar: true
      # 是否允许穿越未知区域；决定规划器能否把未知空间当作可通行。 (Allow unknown; determines if planner can treat unknown space as passable.)
      # 改为 true：更容易找到穿越未知区的路；改为 false：路径更保守。 (If true: easier to find path through unknown areas; If false: more conservative path.)
      allow_unknown: true
# Smoother Server 节点参数块；负责对全局路径做平滑处理。 (Smoother Server node parameter block; responsible for smoothing global paths.)
# 改错节点名或层级：路径平滑器会读不到参数。 (Incorrect node name or hierarchy: path smoother will fail to read parameters.)
smoother_server:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 平滑器列表；决定 smoother server 提供哪些路径平滑器。 (Smoother list; determines which path smoothers the smoother server provides.)
    # 增删平滑器：会改变路径后处理能力或导致引用失败。 (Adding/removing smoothers: will change path post-processing ability or cause reference failure.)
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1
    smoother_plugins: ["savitzky_golay_smoother"]
    # Savitzky-Golay 参数块；用于去掉 NavFn 路径中的细小锯齿和微小折线。 (Savitzky-Golay parameter block; used to remove tiny jaggies and micro zigzags in NavFn paths.)
    # 改错结构或参数：平滑器可能加载失败或平滑效果不稳定。 (Incorrect structure or parameters: smoother may fail to load or smoothing effect becomes unstable.)
    savitzky_golay_smoother:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      # 平滑窗口大小；必须为奇数，窗口更大时更能抑制路径细碎噪声。 (Smoothing window size; must be odd, larger window better suppresses fine path noise.)
      # 调大：更平滑；调小：更贴近原始路径。 (Increase: smoother; Decrease: closer to original path.)
      window_size: 7
      # 拟合多项式阶数；决定每个窗口内如何逼近原始路径。 (Fitting polynomial order; determines how to approximate original path within each window.)
      # 调大：更灵活但更容易保留细碎变化；调小：更保守更稳。 (Increase: more flexible but easier to retain fine changes; Decrease: more conservative and stable.)
      poly_order: 3
      # 是否递归细化平滑结果；可进一步消除微小折线。 (Whether to recursively refine smoothing results; can further eliminate micro zigzags.)
      # 改为 true：更平滑；改为 false：更接近原始路径。 (If true: smoother; If false: closer to original path.)
      do_refinement: true
      # 递归细化次数；决定额外平滑迭代轮数。 (Refinement number; determines number of extra smoothing iterations.)
      # 调大：更平滑但更可能抹掉细节；调小：更保守。 (Increase: smoother but more likely to wipe out details; Decrease: more conservative.)
      refinement_num: 2
      # 是否保留输入路径中的反转/断裂；NavFn 路径一般不需要强制保留。 (Whether to enforce path inversion/breaks; NavFn paths generally don't require this to be enforced.)
      # 改为 false：更利于抹掉 NavFn 小 artifacts；改为 true：更尊重原路径断点。 (If false: better for wiping out small NavFn artifacts; If true: more respectful of original path breakpoints.)
      enforce_path_inversion: false
# Behavior Server 节点参数块；负责恢复行为和辅助动作。 (Behavior Server node parameter block; responsible for recovery behaviors and auxiliary actions.)
# 改错节点名或层级：恢复行为会读不到参数或不可用。 (Incorrect node name or hierarchy: recovery behaviors will fail to read parameters or be unavailable.)
behavior_server:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 输入或输出话题名；决定该模块从哪里取数据或向哪里发数据。 (Input or output topic name; determines where the module gets or sends data.)
    # 改错话题：上下游节点会直接断链。 (Incorrect topic: upstream/downstream nodes will directly disconnect.)
    costmap_topic: local_costmap/costmap_raw
    # 输入或输出话题名；决定该模块从哪里取数据或向哪里发数据。 (Input or output topic name; determines where the module gets or sends data.)
    # 改错话题：上下游节点会直接断链。 (Incorrect topic: upstream/downstream nodes will directly disconnect.)
    footprint_topic: local_costmap/published_footprint
    # 恢复行为循环频率；决定行为服务每秒更新多少次。 (Recovery behavior cycle frequency; determines how many times per second behavior service updates.)
    # 调大：响应更快但 CPU 更高；调小：更省资源但动作更新更慢。 (Increase: faster response but higher CPU; Decrease: saves resources but slower action updates.)
    cycle_frequency: 10.0
    # 恢复行为列表；决定 behavior server 可提供哪些动作。 (Behavior plugin list; determines which actions the behavior server can provide.)
    # 增删行为：会直接改变恢复和辅助动作集合。 (Adding/removing behaviors: will directly change recovery and auxiliary action sets.)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    # Spin 恢复行为参数块；负责原地转向动作。 (Spin recovery behavior parameter block; responsible for spin-in-place action.)
    # 改错结构或参数：原地转向行为可能不可用。 (Incorrect structure or parameters: spin-in-place behavior may be unavailable.)
    spin:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_behaviors/Spin"
    # BackUp 恢复行为参数块；负责后退脱困动作。 (BackUp recovery behavior parameter block; responsible for backward un-stuck action.)
    # 改错结构或参数：后退行为可能不可用。 (Incorrect structure or parameters: backward behavior may be unavailable.)
    backup:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_behaviors/BackUp"
    # DriveOnHeading 恢复行为参数块；负责定向直行动作。 (DriveOnHeading recovery behavior parameter block; responsible for straight driving action.)
    # 改错结构或参数：定向直行行为可能不可用。 (Incorrect structure or parameters: straight driving behavior may be unavailable.)
    drive_on_heading:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_behaviors/DriveOnHeading"
    # Wait 恢复行为参数块；负责等待动作。 (Wait recovery behavior parameter block; responsible for wait action.)
    # 改错结构或参数：等待行为可能不可用。 (Incorrect structure or parameters: wait behavior may be unavailable.)
    wait:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_behaviors/Wait"
    # AssistedTeleop 恢复行为参数块；负责辅助遥控动作。 (AssistedTeleop recovery behavior parameter block; responsible for assisted teleop action.)
    # 改错结构或参数：辅助遥控行为可能不可用。 (Incorrect structure or parameters: assisted teleop behavior may be unavailable.)
    assisted_teleop:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_behaviors/AssistedTeleop"
    # 全局参考坐标系；决定规划、行为或代价地图在 TF 树中的根坐标。 (Global reference frame; determines root frame for planning, behaviors, or costmap in TF tree.)
    # 改成错误坐标系：地图、路径和机器人位姿会整体错位。 (Incorrect frame: map, path, and robot pose will be entirely misaligned.)
    global_frame: odom
    # 机器人基坐标系；决定导航模块认为“机器人本体”对应哪个 TF。 (Robot base frame; determines which TF the navigation module considers as the 'robot body'.)
    # 改成错误坐标系：碰撞检查、控制和行为判断都会失真。 (Incorrect frame: collision checking, control, and behavior judgments will be distorted.)
    robot_base_frame: base_link
    # TF 容忍时间；决定该模块接受多大的 TF 时间偏差。 (TF tolerance time; determines how much TF time deviation this module accepts.)
    # 调大：对 TF 延迟更宽松；调小：更严格但更容易因延迟失败。 (Increase: looser on TF latency; Decrease: stricter but easier to fail due to latency.)
    transform_tolerance: 0.1
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 前向模拟时长；决定恢复行为碰撞预判向前看多远。 (Simulate ahead time; determines how far forward recovery behavior collision anticipation looks.)
    # 调大：更保守、更看远；调小：更灵敏但前瞻更短。 (Increase: more conservative, looks further; Decrease: more sensitive but shorter look-ahead.)
    simulate_ahead_time: 2.0
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    max_rotational_vel: 1.75
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    min_rotational_vel: 0.55
    # 恢复行为角加速度上限；限制转向提速的快慢。 (Rotational acceleration limit for recovery behaviors; limits how fast turning speed can increase.)
    # 调大：转向响应更快但更猛；调小：更柔和但更慢。 (Increase: faster turning response but more abrupt; Decrease: gentler but slower.)
    rotational_acc_lim: 6.0
# Robot State Publisher 参数块；负责基础状态发布的 ROS 参数。 (Robot State Publisher parameter block; responsible for base state publishing ROS parameters.)
# 改错节点名或层级：节点会读不到参数。 (Incorrect node name or hierarchy: node will fail to read parameters.)
robot_state_publisher:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
# Waypoint Follower 节点参数块；负责航点任务执行。 (Waypoint Follower node parameter block; responsible for waypoint task execution.)
# 改错节点名或层级：航点任务器会读不到参数。 (Incorrect node name or hierarchy: waypoint tasker will fail to read parameters.)
waypoint_follower:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 航点任务循环频率；决定 waypoint follower 多快检查一次任务状态。 (Waypoint loop rate; determines how fast waypoint follower checks task status.)
    # 调大：响应更快但线程负载更高；调小：更省资源但响应更慢。 (Increase: faster response but higher thread load; Decrease: saves resources but slower response.)
    loop_rate: 20
    # 是否遇错即停；决定某个航点失败后是否中止整条任务。 (Stop on failure; determines whether to abort entire task if a waypoint fails.)
    # 改为 true：更保守、失败即停；改为 false：失败后会继续后续航点。 (If true: more conservative, stops on failure; If false: continues to subsequent waypoints after failure.)
    stop_on_failure: false
    # 航点任务执行器名称；决定到达航点后调用哪个附加动作模块。 (Waypoint task executor name; determines which additional action module to call after reaching waypoint.)
    # 改错名称：航点执行器会找不到对应任务模块。 (Incorrect name: waypoint executor will not find corresponding task module.)
    waypoint_task_executor_plugin: "wait_at_waypoint"
    # 航点等待任务参数块；负责到点后的停留动作。 (Wait at waypoint task parameter block; responsible for pausing action after arrival.)
    # 改错结构或参数：到点等待行为会异常。 (Incorrect structure or parameters: wait at waypoint behavior will be abnormal.)
    wait_at_waypoint:
      # 插件类名；决定当前参数块最终加载哪种 Nav2 实现。 (Plugin class name; determines which Nav2 implementation this parameter block ultimately loads.)
      # 改成不存在或不兼容的插件：对应功能块会加载失败。 (Incorrect or incompatible plugin: corresponding functional block will fail to load.)
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # 功能开关；决定当前参数块对应的能力是否真正参与运行。 (Enable switch; determines whether ability corresponding to current parameter block actually participates in operation.)
      # 改为 true：该能力生效；改为 false：该能力被关闭。 (If true: ability takes effect; If false: ability is disabled.)
      enabled: true
      # 航点停留时长；决定机器人在每个航点等待多久。 (Waypoint pause duration; determines how long robot waits at each waypoint.)
      # 调大：停留更久、更稳；调小：通过更快。 (Increase: stays longer, more stable; Decrease: passes faster.)
      waypoint_pause_duration: 200
# Velocity Smoother 节点参数块；负责平滑速度指令。 (Velocity Smoother node parameter block; responsible for smoothing velocity commands.)
# 改错节点名或层级：速度平滑器会读不到参数。 (Incorrect node name or hierarchy: velocity smoother will fail to read parameters.)
velocity_smoother:
  # ROS 参数入口；下方配置会直接注入对应节点。 (ROS parameter entry; configurations below will be directly injected into the corresponding node.)
  # 改错这一层级：节点可能完全读不到这些参数。 (Incorrect hierarchy: the node may completely fail to read these parameters.)
  ros__parameters:
    # 是否使用仿真时间；决定该节点读取 /clock 还是真实系统时间。 (Whether to use simulation time; determines if the node reads /clock or real system time.)
    # 改为 true：依赖外部仿真时钟；改为 false：直接使用系统时间。 (If true: relies on external simulation clock; If false: uses system time directly.)
    use_sim_time: false
    # 速度平滑频率；决定速度平滑器每秒输出多少次平滑指令。 (Smoothing frequency; determines how many times per second velocity smoother outputs smoothed commands.)
    # Survey 模式与 controller_frequency 匹配，降至 10 Hz。 (Survey mode matched with controller_frequency, reduced to 10 Hz.)
    smoothing_frequency: 10.0
    # 是否按比例缩放速度向量；决定三轴速度是否整体联动压缩。 (Scale velocities; determines whether 3-axis velocities are scaled together proportionally.)
    # 改为 true：更强调整体比例一致；改为 false：各轴按各自限幅处理。 (If true: emphasizes consistent overall proportion; If false: each axis processed by its own limits.)
    scale_velocities: false
    # 工作模式参数；决定模块按哪种反馈方式运行。 (Working mode parameter; determines which feedback method the module runs under.)
    # 改成更依赖反馈的模式：对传感器更敏感；改成更简单的模式：链路更直接但闭环更弱。 (Change to more feedback-reliant mode: more sensitive to sensors; Change to simpler mode: more direct link but weaker closed-loop.)
    feedback: "OPEN_LOOP"
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    max_velocity: [0.3, 0.0, 1.2] # Changed from [1.0, 0.0, 1.2]
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    min_velocity: [0.0, 0.0, -1.2]
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    max_accel: [1.2, 0.0, 6.0]
    # 上下界参数；用于限制速度、高度、代价或其它量的允许范围。 (Upper/lower bound parameters; used to limit allowable range of speed, height, cost or other quantities.)
    # 调大上界或调小下界：系统更激进；反向调整：系统更保守。 (Increase upper or decrease lower: system more aggressive; Adjust inversely: system more conservative.)
    max_decel: [-3.0, 0.0, -6.0]
    # 输入或输出话题名；决定该模块从哪里取数据或向哪里发数据。 (Input or output topic name; determines where the module gets or sends data.)
    # 改错话题：上下游节点会直接断链。 (Incorrect topic: upstream/downstream nodes will directly disconnect.)
    odom_topic: "/fastlio2/lio_odom"
    # 里程计有效时长；超过该时间的反馈会被视为过期。 (Odometry valid duration; feedback exceeding this time will be considered expired.)
    # 调大：更能容忍慢反馈；调小：更严格但更容易判为过期。 (Increase: more tolerant of slow feedback; Decrease: stricter but easier to judge as expired.)
    odom_duration: 0.1
    # 向量限制参数；分别约束 x、y、theta 三个方向的速度或加速度。 (Vector limit parameters; restricts velocity or acceleration in x, y, theta directions respectively.)
    # 调大：响应更快或限制更宽；调小：更稳更保守。 (Increase: faster response or wider limits; Decrease: more stable and conservative.)
    deadband_velocity: [0.0, 0.0, 0.0]
    # 速度指令超时；超过该时间未收到新指令就会停下。 (Velocity timeout; stops if no new command is received beyond this time.)
    # 调大：更宽容但风险更高；调小：更安全但更容易因抖动停住。 (Increase: more tolerant but higher risk; Decrease: safer but easier to stop due to jitter.)
    velocity_timeout: 1.0

survey_node:
  ros__parameters:
    global_frame_id: "map"
    robot_base_frame_id: "base_link"
    nav_to_pose_action: "navigate_to_pose"
    global_costmap_topic: "/global_costmap/costmap"
