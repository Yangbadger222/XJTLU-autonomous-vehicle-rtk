research_local_obstacle_grid:
  ros__parameters:
    # Resolution/window/origin are NEW_ALGORITHM_SETTING. Original corridor
    # Nav2 local resolution is 0.05 m; this research grid does not replace it.
    # Super-LIO's source cloud is world-frame; the stamped TF adapter is the
    # only producer allowed to make the odom-frame input consumed here.
    input_topic: /lio/cloud_odom
    output_topic: /research/local_obstacle_grid
    map_version_topic: /research/map_version
    target_frame: odom
    resolution_m: 0.30
    origin_x_m: -15.0
    origin_y_m: -15.0
    width: 100
    height: 100
    # Carry-over obstacle height window from the audited FAST-LIO2 output.
    obstacle_min_z_m: 0.08
    obstacle_max_z_m: 1.20
    # Stamped adapter filters source-world z relative to the source IMU origin
    # along gravity, matching FAST-LIO; absolute odom altitude is not height.
    input_height_filter_applied: true
    unknown_is_occupied: true
