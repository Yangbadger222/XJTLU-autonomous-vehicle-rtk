research_observed_ground:
  ros__parameters:
    resolution_m: 0.30
    width: 100
    height: 100
    # All following surface thresholds are NEW_ALGORITHM_SETTING. They assume
    # locally level supported ground; they do not assert measured terrain ability.
    subcells: 4
    floor_band_m: 0.05
    max_plane_residual_m: 0.025
    max_slope: 0.10
    max_neighbor_height_jump_m: 0.025
    obstacle_height_m: 1.20
    # The node imports the recorded LiDAR height and factory lever arm from
    # generated locked constants and rejects any CLI mounting override.
