research_safety_bridge:
  ros__parameters:
    # These are the locked corridor launch limits.  The curvature and
    # lateral-speed gates stay zero until a measured footprint/vehicle model
    # is supplied; the safety bridge then remains stopped by construction.
    authority_timeout_s: 0.50
    health_timeout_s: 0.50
    map_timeout_s: 0.50
    grid_timeout_s: 0.50
    max_speed_mps: 0.85
    min_speed_mps: 0.0
    max_yaw_rate_rps: 0.70
    max_accel_mps2: 0.85
    max_decel_mps2: 1.20
    max_yaw_accel_rps2: 1.40
    max_yaw_decel_rps2: 1.80
    max_curvature_1pm: 0.0
    max_lateral_speed_mps: 0.0
    # Exact corridor local-costmap polygon from the locked baseline.  This is
    # a source carry-over, not a new measurement; runtime confirmation still
    # remains required before live motion.
    footprint_xy: [0.33, 0.305, 0.33, -0.305, -0.33, -0.305, -0.33, 0.305]
