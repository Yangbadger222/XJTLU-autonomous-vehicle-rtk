super_lio_vehicle_adapter:
  ros__parameters:
    input_topic: /lio/odom
    vehicle_odom_topic: /lio/odom_vehicle
    source_health_topic: /lio/health
    health_topic: /lio/vehicle_health
    source_frame: world
    world_frame: odom
    source_child_frame: imu
    base_frame: base_footprint
    # Original FAST publishOdometry directly publishes IMU state as this
    # navigation point. This identity is not a physical chassis-center claim.
    navigation_reference_convention: locked_fast_imu_origin
    navigation_reference_contract: corridor_e54c6af_fast_imu_origin_v1
    imu_to_base_extrinsic_verified: false
    imu_to_base_translation_m: [0.0, 0.0, 0.0]
    imu_to_base_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    # odom follows the fresh Super local-world gauge; RTK owns map->odom.
    world_gauge_mode: source_local_world
    require_source_health_ok: true
    require_covariance: true
    # Coordinate-valid unhealthy odom can be observed in shadow; the health
    # channel stays UNKNOWN and the final safety bridge forbids motion.
    publish_unhealthy_odometry: true
    tf_timeout_s: 0.05

    control_odom_topic: /research/odom_control

    control_child_frame: chassis_control_origin

    control_reference_contract: corridor_e54c6af_mid360_ground_control_origin_v1

    control_translation_imu_m: [0.05900000000000001, -0.14329, -0.40288]
