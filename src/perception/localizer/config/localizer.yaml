cloud_topic: /fastlio2/body_cloud_localization
odom_topic: /fastlio2/lio_odom
map_frame: map
local_frame: lidar
update_hz: 1.0
max_tf_input_age_s: 2.0
tf_republish_hz: 20.0
status_hz: 5.0
continuous_icp: true
global_max_candidates: 5
min_candidate_score_gap: 0.03
min_overlap_ratio: 0.35
correction_alpha: 0.15
max_correction_translation_m: 0.30
max_correction_yaw_rad: 0.20
max_consecutive_failures: 5

rough_scan_resolution: 0.25
rough_map_resolution: 0.25
rough_max_iteration: 5
rough_score_thresh: 0.2

refine_scan_resolution: 0.1
refine_map_resolution: 0.1
refine_max_iteration: 10
refine_score_thresh: 0.1
