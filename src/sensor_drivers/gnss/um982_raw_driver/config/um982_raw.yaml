um982_raw_driver:
  ros__parameters:
    # Dedicated binary port. Never point this node at the production NMEA/NTRIP port.
    port: /dev/rtk_um982_raw
    baud: 921600
    frame_id: gnss_raw
    output_topic: /gnss/raw/frame
    diagnostics_topic: /gnss/raw/diagnostics
    read_chunk_bytes: 4096
    max_read_batches_per_tick: 16
    read_timeout_ms: 20
    max_payload_bytes: 65535
    max_buffer_bytes: 131072
    reconnect_period_s: 1.0
    diagnostics_period_s: 1.0
    stale_frame_timeout_s: 2.0
