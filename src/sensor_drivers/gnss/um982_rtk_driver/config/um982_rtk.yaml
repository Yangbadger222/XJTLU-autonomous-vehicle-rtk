um982_rtk_driver:
  ros__parameters:
    port: /dev/rtk_um982
    baud: 115200
    frame_id: gps
    heading_offset_deg: 88.5
    # UNIHEADING is the verified dual-antenna stream for motion authority.
    # THS is still recorded in rtk/nmea_sentence but cannot seize /heading.
    heading_primary_source: UNIHEADING
    heading_fallback_source: HPR
    heading_fallback_timeout_s: 1.5
    heading_switch_min_samples: 3
    heading_max_rate_degps: 75.0
    heading_max_step_deg: 15.0
    heading_rate_slack_deg: 2.0
    heading_recovery_min_samples: 3
    heading_recovery_max_step_deg: 7.5
    heading_recovery_max_rebase_deg: 45.0
    heading_hpr_requires_rtk_health: true
    heading_hpr_max_gga_age_s: 1.5
    publish_raw: true
    status_period_s: 1.0
    ntrip:
      enabled: false
      host: ""
      port: 2101
      mountpoint: ""
      username: ""
      password: ""
      password_env: NTRIP_PASSWORD
      send_gga_interval_s: 5.0
      reconnect_initial_backoff_s: 1.0
      reconnect_max_backoff_s: 10.0
      reconnect_jitter_s: 0.2
      reconnect_without_valid_gga: true
      max_cached_valid_gga_age_s: 30.0
      rtcm_fresh_timeout_s: 3.0
      rtcm_hard_timeout_s: 10.0
